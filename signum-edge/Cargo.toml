[package]
name = "signum-edge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Signum public edge reverse proxy and SMPv2 multiplexed tunnel server"

[dependencies]
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", features = ["std", "tls12"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
x509-parser = "0.16"
dashmap = "6"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha3 = "0.10"
sha2 = "0.10"
rand = "0.8"
ipnet = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
base64 = "0.23"
serde_json = "1"
hex = "0.4"
