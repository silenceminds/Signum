name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-edge:
    name: Rust (signum-edge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: signum-edge
      - name: Run cargo test
        working-directory: signum-edge
        run: cargo test --locked
      - name: Build release binary
        working-directory: signum-edge
        run: cargo build --release --locked

  c11-agent-linux:
    name: C11 (signum-agent & signum-ctl) - Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev
      - name: Configure and build
        working-directory: signum-agent
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
